# Workspace root: the app plus the Rust bindings over the upstream libmdr engine
# DLLs (crates/mdr-sys, crates/mdr). See
# docs/engine/SoundConnect Desktop - Rust Engine Bindings.md
[workspace]
resolver = "2"
members = ["crates/mdr-sys", "crates/mdr", "crates/winaudio"]
# `cargo test --manifest-path src-tauri/Cargo.toml` (pnpm test:rust) covers all four.
default-members = [".", "crates/mdr-sys", "crates/mdr", "crates/winaudio"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[package]
name = "soundconnect-desktop"
version = "0.1.0"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "soundconnect_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-opener = "=2.7.1"
tauri-plugin-single-instance = "=2.5.3"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-updater = "=2.13.3"
tauri-plugin-process = "=2.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.153"
thiserror = "=2.0.21"
mdr = { path = "crates/mdr" }
winaudio = { path = "crates/winaudio" }
crossbeam-channel = "=0.5.17"

# Size-optimised release profile from the create-tauri-app template,
# see https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
